# Rotulo de cada tag nos dois idiomas.
#
# O SLUG (a chave) e a ANCORA e nao muda nunca: `tags.html#S02-03` publicado nao pode passar a
# apontar para outro lugar. Aqui se traduz so o ROTULO exibido.
#
# Por que este arquivo e nao um campo no frontmatter: a mesma tag vive em varios verbetes, e
# declarar a traducao em cada um criaria um segundo lugar guardando o mesmo fato.
#
# TRAVA: a FF-25 confere que toda tag usada tem entrada aqui, com os DOIS idiomas. O render recua
# para o proprio slug quando falta, de proposito -- rotulo faltante nao pode apagar a navegacao de
# uma pagina publicada. E por ser fail-open no display que a trava precisa existir: tag nova nasce
# reprovando ate ganhar a sua linha.
#
# Codigo de sessao tem os dois idiomas iguais, e nao ha lista de excecao: uniformizar custa uma
# linha por sessao, e manter excecao custa mais.

